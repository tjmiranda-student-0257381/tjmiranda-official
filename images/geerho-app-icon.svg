<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="iconBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="35%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#996515" />
    </linearGradient>

    <!-- Blue Gradient -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Red Gradient for Beta tag -->
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- iOS App Icon Squircle Shape with Shadow -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#iconBg)" stroke="url(#goldGrad)" stroke-width="4" filter="url(#shadow)" />

  <!-- Subtle Inner Grid / Glow Aura -->
  <circle cx="256" cy="230" r="170" fill="url(#blueGrad)" opacity="0.15" filter="url(#glow)" />
  <circle cx="256" cy="230" r="100" fill="url(#goldGrad)" opacity="0.1" filter="url(#glow)" />

  <!-- Stylized Marketplace Bag + "G" Logo Combination -->
  <!-- Bag Body -->
  <path d="M140 210 C140 180, 160 170, 190 170 L322 170 C352 170, 372 180, 372 210 L392 370 C394 395, 375 415, 350 415 L162 415 C137 415, 118 395, 120 370 Z" 
        fill="#131826" stroke="url(#goldGrad)" stroke-width="8" stroke-linejoin="round" />

  <!-- Bag Handles -->
  <path d="M200 170 V120 C200 89, 225 64, 256 64 C287 64, 312 89, 312 120 V170" 
        fill="none" stroke="url(#goldGrad)" stroke-width="12" stroke-linecap="round" />

  <!-- Central "G" Monogram -->
  <path d="M295 245 C285 235, 270 228, 254 228 C220 228, 195 255, 195 292 C195 330, 222 356, 256 356 C285 356, 305 340, 312 314 H256 V282 H344 C346 290, 347 299, 347 308 C347 358, 308 388, 255 388 C198 388, 158 346, 158 292 C158 238, 198 196, 256 196 C284 196, 310 207, 328 226 Z" 
        fill="url(#goldGrad)" />

  <!-- Speed Wings / Marketplace Sparkles -->
  <path d="M380 140 L388 158 L406 166 L388 174 L380 192 L372 174 L354 166 L372 158 Z" fill="url(#goldGrad)" filter="url(#glow)" />
  <path d="M125 145 L129 156 L140 160 L129 164 L125 175 L121 164 L110 160 L121 156 Z" fill="url(#blueGrad)" />

  <!-- Top Ribbon Beta Badge -->
  <g transform="translate(320, 36)">
    <rect x="0" y="0" width="130" height="38" rx="19" fill="url(#redGrad)" stroke="#ffffff" stroke-width="2" />
    <text x="65" y="24" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="900" text-anchor="middle" letter-spacing="2">BETA</text>
  </g>
</svg>
