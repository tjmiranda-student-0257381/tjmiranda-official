<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 820" width="100%" height="100%">
  <defs>
    <!-- Background & Frame Gradients -->
    <linearGradient id="phoneFrame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="screenBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#0d111c" />
      <stop offset="100%" stop-color="#05070c" />
    </linearGradient>

    <linearGradient id="goldBanner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#a16207" />
    </linearGradient>

    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e2433" />
      <stop offset="100%" stop-color="#121622" />
    </linearGradient>

    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.65" />
    </filter>

    <clipPath id="screenClip">
      <rect x="150" y="40" width="380" height="740" rx="46" />
    </clipPath>
  </defs>

  <style>
    .txt-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  </style>

  <!-- Ambient Glow Behind Phone -->
  <ellipse cx="340" cy="410" rx="260" ry="340" fill="#007bff" opacity="0.12" filter="url(#softGlow)" />
  <ellipse cx="340" cy="220" rx="190" ry="160" fill="#d4af37" opacity="0.1" filter="url(#softGlow)" />

  <!-- Outer Phone Chassis with Drop Shadow -->
  <rect x="142" y="32" width="396" height="756" rx="52" fill="url(#phoneFrame)" stroke="#334155" stroke-width="3" filter="url(#cardShadow)" />
  <!-- Bezel -->
  <rect x="146" y="36" width="388" height="748" rx="49" fill="#030712" />

  <!-- Screen Content Area (Clipped) -->
  <g clip-path="url(#screenClip)">
    <rect x="150" y="40" width="380" height="740" fill="url(#screenBg)" />

    <!-- Dynamic Island / Top Camera -->
    <rect x="290" y="52" width="100" height="26" rx="13" fill="#000000" />
    <circle cx="370" cy="65" r="4.5" fill="#1e293b" />

    <!-- Status Bar (Time & Icons) -->
    <text x="180" y="70" fill="#e2e8f0" font-size="13" font-weight="600" class="txt-sans">9:41</text>
    <g transform="translate(470, 58)">
      <!-- WiFi Icon -->
      <path d="M0 10 A7 7 0 0 1 12 10 M2.5 12 A4 4 0 0 1 9.5 12 M5 14 A1 1 0 0 1 7 14" stroke="#e2e8f0" stroke-width="1.5" fill="none" stroke-linecap="round" />
      <!-- Battery Icon -->
      <rect x="18" y="3" width="20" height="10" rx="3" fill="none" stroke="#e2e8f0" stroke-width="1.5" />
      <rect x="20" y="5" width="13" height="6" rx="1.5" fill="#10b981" />
      <path d="M39 6.5 V9.5" stroke="#e2e8f0" stroke-width="1.5" stroke-linecap="round" />
    </g>

    <!-- App Header -->
    <g transform="translate(170, 95)">
      <!-- Geerho Wordmark -->
      <text x="0" y="24" fill="#ffffff" font-size="22" font-weight="900" letter-spacing="0.5" class="txt-sans">Geerho</text>
      <!-- Beta Pill -->
      <rect x="88" y="8" width="52" height="20" rx="10" fill="#dc2626" />
      <text x="114" y="22" fill="#ffffff" font-size="10" font-weight="800" text-anchor="middle" class="txt-sans">BETA</text>

      <!-- TestFlight Indicator Icon -->
      <circle cx="316" cy="18" r="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
      <path d="M316 10 L319 16 L325 17 L321 21 L322 27 L316 24 L310 27 L311 21 L307 17 L313 16 Z" fill="#38bdf8" />
    </g>

    <!-- Founding Seller VIP Banner -->
    <g transform="translate(166, 140)">
      <rect x="0" y="0" width="348" height="104" rx="18" fill="url(#cardBg)" stroke="url(#goldBanner)" stroke-width="1.5" filter="url(#cardShadow)" />
      
      <!-- VIP Badge Icon -->
      <circle cx="34" cy="34" r="18" fill="url(#goldBanner)" />
      <!-- Star in badge -->
      <path d="M34 23 L37 29 L44 30 L39 35 L40 42 L34 39 L28 42 L29 35 L24 30 L31 29 Z" fill="#111827" />

      <text x="62" y="28" fill="#fef08a" font-size="11" font-weight="800" letter-spacing="1" class="txt-sans">EXCLUSIVE BETA MEMBERSHIP</text>
      <text x="62" y="47" fill="#ffffff" font-size="16" font-weight="800" class="txt-sans">First 300 Founding Sellers</text>

      <!-- Perks Badges Inside VIP Card -->
      <g transform="translate(16, 64)">
        <!-- 0% Commission Badge -->
        <rect x="0" y="0" width="144" height="26" rx="13" fill="rgba(212, 175, 55, 0.15)" stroke="#d4af37" stroke-width="1" />
        <circle cx="13" cy="13" r="5" fill="#d4af37" />
        <text x="24" y="17" fill="#fef08a" font-size="11" font-weight="700" class="txt-sans">0% Commission</text>

        <!-- 30 Listings / Month Badge -->
        <rect x="152" y="0" width="164" height="26" rx="13" fill="rgba(56, 189, 248, 0.15)" stroke="#38bdf8" stroke-width="1" />
        <circle cx="165" cy="13" r="5" fill="#38bdf8" />
        <text x="176" y="17" fill="#bae6fd" font-size="11" font-weight="700" class="txt-sans">30 Listings / Mo (1/Day)</text>
      </g>
    </g>

    <!-- Daily Listing Meter Bar -->
    <g transform="translate(166, 260)">
      <rect x="0" y="0" width="348" height="52" rx="14" fill="#131927" stroke="#1e293b" stroke-width="1" />
      <text x="16" y="24" fill="#94a3b8" font-size="11" font-weight="600" class="txt-sans">Today's Daily Listing Allowance</text>
      <text x="332" y="24" fill="#10b981" font-size="11" font-weight="700" text-anchor="end" class="txt-sans">1 / 1 Ready</text>

      <!-- Progress Track -->
      <rect x="16" y="32" width="316" height="6" rx="3" fill="#1e293b" />
      <rect x="16" y="32" width="316" height="6" rx="3" fill="url(#goldBanner)" />
    </g>

    <!-- Section Title: Active Marketplace Items -->
    <g transform="translate(166, 332)">
      <text x="0" y="14" fill="#f8fafc" font-size="14" font-weight="700" class="txt-sans">Featured Test Listings</text>
      <text x="348" y="14" fill="#38bdf8" font-size="12" font-weight="600" text-anchor="end" class="txt-sans">View All &gt;</text>
    </g>

    <!-- Marketplace Item 1 -->
    <g transform="translate(166, 360)">
      <rect x="0" y="0" width="168" height="210" rx="14" fill="url(#cardBg)" stroke="#1e293b" stroke-width="1" />
      <!-- Item Thumbnail with subtle gradient -->
      <rect x="8" y="8" width="152" height="110" rx="10" fill="#0f172a" />
      <!-- Watch icon illustration in thumbnail -->
      <circle cx="84" cy="63" r="28" fill="#1e293b" stroke="#d4af37" stroke-width="2" />
      <circle cx="84" cy="63" r="2" fill="#d4af37" />
      <line x1="84" y1="63" x2="84" y2="47" stroke="#d4af37" stroke-width="2" stroke-linecap="round" />
      <line x1="84" y1="63" x2="96" y2="63" stroke="#d4af37" stroke-width="2" stroke-linecap="round" />
      <!-- 0% Fee Pill -->
      <rect x="14" y="14" width="62" height="18" rx="9" fill="rgba(16, 185, 129, 0.2)" stroke="#10b981" stroke-width="1" />
      <text x="45" y="27" fill="#6ee7b7" font-size="9" font-weight="700" text-anchor="middle" class="txt-sans">0% FEE</text>

      <text x="12" y="140" fill="#f1f5f9" font-size="12" font-weight="700" class="txt-sans">Automatic Chrono</text>
      <text x="12" y="156" fill="#94a3b8" font-size="10" class="txt-sans">Condition: Brand New</text>
      <text x="12" y="184" fill="#fef08a" font-size="15" font-weight="900" class="txt-sans">$240.00</text>
      <!-- Sell Tag -->
      <rect x="110" y="168" width="46" height="22" rx="6" fill="#2563eb" />
      <text x="133" y="183" fill="#ffffff" font-size="10" font-weight="700" text-anchor="middle" class="txt-sans">BUY</text>
    </g>

    <!-- Marketplace Item 2 -->
    <g transform="translate(346, 360)">
      <rect x="0" y="0" width="168" height="210" rx="14" fill="url(#cardBg)" stroke="#1e293b" stroke-width="1" />
      <!-- Item Thumbnail -->
      <rect x="8" y="8" width="152" height="110" rx="10" fill="#0f172a" />
      <!-- Camera/Gear graphic in thumbnail -->
      <rect x="60" y="45" width="48" height="36" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
      <circle cx="84" cy="63" r="11" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />
      <circle cx="98" cy="53" r="3" fill="#f43f5e" />
      <!-- 0% Fee Pill -->
      <rect x="14" y="14" width="62" height="18" rx="9" fill="rgba(16, 185, 129, 0.2)" stroke="#10b981" stroke-width="1" />
      <text x="45" y="27" fill="#6ee7b7" font-size="9" font-weight="700" text-anchor="middle" class="txt-sans">0% FEE</text>

      <text x="12" y="140" fill="#f1f5f9" font-size="12" font-weight="700" class="txt-sans">Vintage Lens 50mm</text>
      <text x="12" y="156" fill="#94a3b8" font-size="10" class="txt-sans">Condition: Like New</text>
      <text x="12" y="184" fill="#fef08a" font-size="15" font-weight="900" class="txt-sans">$95.00</text>
      <rect x="110" y="168" width="46" height="22" rx="6" fill="#2563eb" />
      <text x="133" y="183" fill="#ffffff" font-size="10" font-weight="700" text-anchor="middle" class="txt-sans">BUY</text>
    </g>

    <!-- TestFlight Beta Notification Banner on Screen -->
    <g transform="translate(166, 584)">
      <rect x="0" y="0" width="348" height="66" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
      <circle cx="28" cy="33" r="14" fill="#0284c7" />
      <!-- Download Arrow in Circle -->
      <path d="M28 26 V36 M24 33 L28 37 L32 33" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      <text x="52" y="28" fill="#ffffff" font-size="12" font-weight="700" class="txt-sans">Apple Approved Beta Build</text>
      <text x="52" y="46" fill="#94a3b8" font-size="11" class="txt-sans">Direct link: no invitation code required</text>
    </g>

    <!-- Bottom Navigation Bar -->
    <g transform="translate(150, 660)">
      <rect x="0" y="0" width="380" height="70" fill="#090d16" stroke="#1e293b" stroke-width="1" />
      
      <!-- Nav Icons -->
      <!-- 1. Home (Active) -->
      <g transform="translate(40, 16)">
        <path d="M0 14 L12 3 L24 14 V24 H0 Z" fill="#38bdf8" />
        <text x="12" y="34" fill="#38bdf8" font-size="9" font-weight="700" text-anchor="middle" class="txt-sans">Home</text>
      </g>
      <!-- 2. Search -->
      <g transform="translate(112, 16)">
        <circle cx="10" cy="10" r="7" fill="none" stroke="#64748b" stroke-width="2" />
        <line x1="15" y1="15" x2="21" y2="21" stroke="#64748b" stroke-width="2" stroke-linecap="round" />
        <text x="10" y="34" fill="#64748b" font-size="9" font-weight="600" text-anchor="middle" class="txt-sans">Explore</text>
      </g>
      <!-- 3. Sell (Big Gold + Button) -->
      <g transform="translate(175, 8)">
        <circle cx="15" cy="15" r="20" fill="url(#goldBanner)" filter="url(#cardShadow)" />
        <line x1="15" y1="8" x2="15" y2="22" stroke="#111827" stroke-width="3" stroke-linecap="round" />
        <line x1="8" y1="15" x2="22" y2="15" stroke="#111827" stroke-width="3" stroke-linecap="round" />
        <text x="15" y="42" fill="#fef08a" font-size="9" font-weight="700" text-anchor="middle" class="txt-sans">List Item</text>
      </g>
      <!-- 4. Activity -->
      <g transform="translate(250, 16)">
        <path d="M10 2 A8 8 0 0 0 2 10 C2 15 0 17 0 17 H20 S18 15 18 10 A8 8 0 0 0 10 2 Z" fill="none" stroke="#64748b" stroke-width="1.8" />
        <text x="10" y="34" fill="#64748b" font-size="9" font-weight="600" text-anchor="middle" class="txt-sans">Activity</text>
      </g>
      <!-- 5. Profile -->
      <g transform="translate(320, 16)">
        <circle cx="10" cy="8" r="5" fill="none" stroke="#64748b" stroke-width="1.8" />
        <path d="M2 22 C2 17 6 15 10 15 C14 15 18 17 18 22" fill="none" stroke="#64748b" stroke-width="1.8" />
        <text x="10" y="34" fill="#64748b" font-size="9" font-weight="600" text-anchor="middle" class="txt-sans">Profile</text>
      </g>

      <!-- Home Indicator Line -->
      <rect x="125" y="58" width="130" height="4" rx="2" fill="#475569" />
    </g>
  </g>

  <!-- Floating Callout Badge 1: Top Right (No Invite Code Needed) -->
  <g transform="translate(470, 90)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="190" height="64" rx="14" fill="#111827" stroke="#38bdf8" stroke-width="2" />
    <circle cx="24" cy="32" r="14" fill="#0284c7" />
    <path d="M18 32 L22 36 L30 27" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <text x="46" y="26" fill="#38bdf8" font-size="11" font-weight="800" class="txt-sans">DIRECT TESTFLIGHT</text>
    <text x="46" y="44" fill="#f8fafc" font-size="12" font-weight="700" class="txt-sans">No Code Required</text>
  </g>

  <!-- Floating Callout Badge 2: Bottom Left (First 300 Sellers - 0% Commission) -->
  <g transform="translate(20, 480)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="220" height="88" rx="16" fill="#111827" stroke="#d4af37" stroke-width="2" />
    <circle cx="32" cy="34" r="18" fill="url(#goldBanner)" />
    <!-- Crown icon -->
    <path d="M24 40 L22 30 L28 34 L32 26 L36 34 L42 30 L40 40 Z" fill="#111827" />
    <text x="58" y="28" fill="#fef08a" font-size="11" font-weight="800" class="txt-sans">FOUNDING SELLERS</text>
    <text x="58" y="47" fill="#ffffff" font-size="14" font-weight="800" class="txt-sans">0% Commission</text>
    <text x="24" y="72" fill="#94a3b8" font-size="11" font-weight="600" class="txt-sans">1 item/day &bull; 30 listings/mo</text>
  </g>
</svg>
